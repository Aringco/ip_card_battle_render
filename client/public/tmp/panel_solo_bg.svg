<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid slice">
  <!-- 임시 에셋 — 싱글플레이 패널 일러스트로 대체 예정 -->
  <defs>
    <linearGradient id="soloBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <pattern id="soloHatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#ffffff" stroke-width="7" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="500" height="600" fill="url(#soloBg)"/>
  <rect width="500" height="600" fill="url(#soloHatch)"/>
  <path d="M0 600 Q120 470 260 530 Q380 580 500 500 L500 600 Z" fill="#052e16" opacity="0.5"/>
  <rect x="10" y="10" width="480" height="580" fill="none" stroke="#ffffff" stroke-opacity="0.22"
        stroke-width="3" stroke-dasharray="16 12" rx="14"/>
  <!-- TMP 표기는 로고 박스의 배지가 대신한다 — 패널은 비율에 따라 잘려서 글자 조각만 남는다 -->
</svg>
