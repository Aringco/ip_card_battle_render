# CI — 푸시 · PR마다 서버 테스트와 타입 검사(서버 · 클라이언트)를 돌린다.
# 테스트 서버의 자동 배포(deploy/deploy.sh)는 main 커밋의 이 검사가 성공해야 배포한다(deploy/README.md).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 서버 타입 검사
        run: npx tsc --noEmit -p server
      - name: 클라이언트 타입 검사
        run: npx tsc --noEmit -p client
      - name: 서버 테스트
        run: npm test --workspace=server
