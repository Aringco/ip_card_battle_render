services:
  card-battle:
    build:
      context: .
      args:
        # 비워 두면 클라이언트가 자기 호스트의 /ws로 붙는다 — 로컬에서도 다른 PC에서도
        # 그대로 맞으므로 보통은 손댈 일이 없다. 클라이언트와 WS가 서로 다른 호스트에
        # 있는 특수한 배치에서만 wss://<도메인>/ws 를 적는다.
        NEXT_PUBLIC_WS_URL: ""
    ports:
      - "3000:3000"
    restart: unless-stopped
